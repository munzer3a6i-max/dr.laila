<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>لوحة الطلبات — د. دلال العصيمي</title>
<link rel="icon" href="/assets/images/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<!-- ─────────────── sign in ─────────────── -->
<section class="gate" id="gate" hidden>
  <form class="gate__card" id="login-form">
    <img class="gate__logo" src="/assets/images/headerlogo.png" alt="" width="168" height="58">
    <h1>لوحة الطلبات</h1>
    <p class="gate__sub">أدخل كلمة المرور للمتابعة</p>

    <label class="sr-only" for="pw">كلمة المرور</label>
    <input type="password" id="pw" name="password" autocomplete="current-password" required
           placeholder="كلمة المرور">

    <p class="gate__error" id="login-error" role="alert" hidden></p>

    <button class="btn btn--primary btn--block" type="submit" id="login-btn">
      <span>دخول</span><span class="spinner" aria-hidden="true"></span>
    </button>
  </form>
</section>

<!-- ─────────────── dashboard ─────────────── -->
<div class="app" id="app" hidden>

  <header class="topbar">
    <div class="topbar__brand">
      <img src="/assets/images/headerlogo.png" alt="" width="140" height="49">
      <span class="topbar__title">لوحة الطلبات</span>
    </div>
    <div class="topbar__actions">
      <button class="btn btn--ghost btn--sm" type="button" id="refresh">تحديث</button>
      <button class="btn btn--ghost btn--sm" type="button" id="logout">خروج</button>
    </div>
  </header>

  <main class="wrap">

    <nav class="tabs" id="tabs" aria-label="تصفية حسب الحالة">
      <button class="tab is-on" type="button" data-status="all">الكل <span class="tab__n" data-count="all">0</span></button>
      <button class="tab" type="button" data-status="pending">بانتظار الدفع <span class="tab__n" data-count="pending">0</span></button>
      <button class="tab" type="button" data-status="contacted">تم التواصل <span class="tab__n" data-count="contacted">0</span></button>
      <button class="tab" type="button" data-status="paid">مدفوع <span class="tab__n" data-count="paid">0</span></button>
      <button class="tab" type="button" data-status="cancelled">ملغي <span class="tab__n" data-count="cancelled">0</span></button>
    </nav>

    <p class="feedback" id="feedback" role="status" hidden></p>

    <div class="list" id="list" aria-live="polite"></div>
    <p class="empty" id="empty" hidden>لا توجد طلبات في هذه الحالة.</p>

  </main>
</div>

<!-- ─────────────── request detail ─────────────── -->
<div class="drawer" id="drawer" hidden>
  <div class="drawer__scrim" data-close></div>
  <aside class="drawer__panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <header class="drawer__head">
      <h2 id="drawer-title">تفاصيل الطلب</h2>
      <button class="icon-x" type="button" data-close aria-label="إغلاق">
        <svg viewBox="0 0 20 20" fill="none"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </header>
    <div class="drawer__body" id="drawer-body"></div>
  </aside>
</div>

<script src="/admin/admin.js" defer></script>
</body>
</html>
